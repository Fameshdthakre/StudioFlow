name: Deploy StudioFlow to mvserver

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      package_release: true

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    # Label the existing mvserver runner; PRs run only on GitHub-hosted runners.
    runs-on: [self-hosted, linux, x64, studioflow-production]
    environment: production
    timeout-minutes: 30
    concurrency:
      group: studioflow-production
      cancel-in-progress: false
    steps:
      # No checkout here: cleanup must never touch the previous checkout's data.
      - name: Download the tested image and deployment bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: studioflow-${{ github.sha }}
          path: ${{ runner.temp }}/studioflow-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy the verified revision
        shell: bash
        env:
          RELEASE_BUNDLE: ${{ runner.temp }}/studioflow-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_SHA: ${{ github.sha }}
          STUDIOFLOW_DEPLOY_DIR: /srv/studioflow
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$RELEASE_BUNDLE/deploy.py" \
            --bundle "$RELEASE_BUNDLE" \
            --state-dir "$STUDIOFLOW_DEPLOY_DIR" \
            --revision "$RELEASE_SHA" \
            --check-main

      - name: Record deployment result
        if: success()
        shell: bash
        run: echo 'Deployment finished or skipped because a newer main revision exists. Check the deploy step for the outcome.' >> "$GITHUB_STEP_SUMMARY"

