name: Deploy StudioFlow (Self-Hosted mvserver)

on:
  push:
    branches: ["main"]
    paths:
      - "app.py"
      - "studioflow/**"
      - "static/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.lock"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: 1. Checkout Latest Code
        uses: actions/checkout@v4

      - name: 2. Inject Production Environment
        env:
          PROD_ENV: ${{ secrets.PROD_ENV_FILE || vars.PROD_ENV_FILE }}
        run: |
          if [ -z "$PROD_ENV" ]; then
            echo "::error::GitHub Secret PROD_ENV_FILE is empty or not configured!"
            exit 1
          fi
          printf '%s\n' "$PROD_ENV" > .env
          chmod 600 .env
          echo "Production .env successfully generated from GitHub Configuration."

      - name: 3. Ensure Storage Directories & Permissions
        run: |
          echo "Ensuring data directories exist and have full read/write permissions..."
          mkdir -p data/uploads data/outputs data/brand_logos
          chmod -R 777 data/ || true
          sudo chown -R 10001:10001 data/ 2>/dev/null || true

      - name: 4. Build and Recreate StudioFlow Container
        run: |
          echo "Building StudioFlow container image..."
          docker compose build studioflow
          echo "Starting updated container..."
          docker compose up -d --build --force-recreate --remove-orphans studioflow

      - name: 5. Verify Service Health
        run: |
          echo "Waiting for StudioFlow to start and pass healthcheck..."
          for i in {1..20}; do
            if curl -sf http://localhost:8000/api/health > /dev/null; then
              echo ">>> StudioFlow is healthy and responding on http://localhost:8000!"
              exit 0
            fi
            echo "Waiting for healthcheck to pass... ($i/20)"
            sleep 3
          done

          echo "::error::Healthcheck failed! Dumping recent container logs:"
          docker compose logs --tail=100 studioflow
          exit 1

      - name: 6. Clean Unused Docker Build Layers
        if: always()
        run: |
          docker image prune -f

