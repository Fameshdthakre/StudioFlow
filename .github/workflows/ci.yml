name: StudioFlow checks

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      package_release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Install the locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Run Python and browser-logic tests
        run: |
          python -m unittest discover -s tests -v
          node --test tests/frontend.test.cjs

      - name: Build the production image
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: docker build --label "org.opencontainers.image.revision=$RELEASE_SHA" -t "studioflow:$RELEASE_SHA" .

      - name: Test container startup and demo generation
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: python scripts/smoke_container.py "studioflow:$RELEASE_SHA"

      - name: Package the tested image
        if: inputs.package_release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: python scripts/package_release.py "$RELEASE_SHA" "$RUNNER_TEMP/studioflow-release"

      - name: Upload the deployment bundle
        if: inputs.package_release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: studioflow-${{ github.sha }}
          path: ${{ runner.temp }}/studioflow-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
