services:
  studioflow:
    build: .
    container_name: studioflow
    restart: unless-stopped
    stop_grace_period: 240s
    env_file:
      - .env
    environment:
      # These override .env: network containers always require accounts.
      STUDIOFLOW_REQUIRE_AUTH: "1"
      ALLOW_ANONYMOUS_DEMO: "0"
      STUDIOFLOW_LOAD_DOTENV: "0"
      STUDIOFLOW_DATA_DIR: /app/data
    ports:
      - "${STUDIOFLOW_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      # Persistent storage for sqlite database, uploads, logos, and generated images
      - ./data:/app/data

